name: Bug report (tooling)
description: Something wrong with the parser, CLI, web app, or guide
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command or input, what you got, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Environment
      placeholder: "OS, Python version, commit"
