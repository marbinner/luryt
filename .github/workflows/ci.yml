name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --locked

      - name: Canonical language sources
        run: uv run python scripts/language.py check

      - name: Tests (parser, numbers, data, docs, repository contracts)
        run: uv run pytest -q

      - name: Build distribution
        run: uv build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Website JavaScript syntax
        run: |
          node --check docs/assets/js/guide.mjs
          node --check docs/assets/js/dictionary.mjs
