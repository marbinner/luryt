[project]
name = "luryt"
version = "0.2.0"
description = "luryt — an engineered constructed language, plus its reference tooling"
requires-python = ">=3.12"

[project.scripts]
luryt = "conlang_tools.cli:main"
conlang = "conlang_tools.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conlang_tools"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
